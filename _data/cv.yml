    Experience:
      - company: "The University of Manchester"
        position: "PhD Researcher — Neural Field Optimization for Hybrid Manufacturing"
        location: "Manchester, UK"
        start_date: "2025-05"
        end_date: "2026-05"
        highlights:
          - "Developed a neural field-based optimization framework for hybrid additive-subtractive manufacturing, jointly optimizing fabrication sequences and tool orientations for complex geometries."
          - "Formulated an FEA-guided, distortion-aware optimization strategy to improve the mechanical stability of intermediate structures while considering manufacturability constraints."
          - "Improved efficiency on large-scale models and manufacturing accuracy; first-author journal manuscript currently under review."

      - company: "The University of Manchester"
        position: "PhD Researcher — Inverse Operation-Based Planning for Hybrid Manufacturing"
        location: "Manchester, UK"
        start_date: "2024-05"
        end_date: "2025-05"
        highlights:
          - "Developed an inverse-operation-based planning framework for hybrid additive-subtractive manufacturing, formulating fabrication as a reverse process from the target geometry to an initial state."
          - "Enabled the fabrication of complex geometries without restrictive manufacturability constraints; published in ACM Transactions on Graphics (SIGGRAPH Asia 2025), with oral presentation."

      - company: "The University of Manchester"
        position: "PhD Researcher — Trajectory Co-Optimization for Robot-Assisted Manufacturing"
        location: "Manchester, UK"
        start_date: "2023-09"
        end_date: "2024-05"
        highlights:
          - "Developed a unified framework jointly optimizing tool orientations, kinematic redundancy, and waypoint timing for multi-axis robot-assisted manufacturing."
          - "Achieved smooth and efficient robot motions across complex, large-scale toolpaths; results published in IEEE Transactions on Automation Science and Engineering, 2025."

      - company: "Shanghai Jiao Tong University"
        position: "Research Assistant — 6-DoF Path Optimization in Robotic Flank Milling"
        location: "Shanghai, China"
        start_date: "2022-10"
        end_date: "2023-03"
        highlights:
          - "Developed a unified optimization framework for 6-DoF toolpath planning in robotic flank milling, jointly considering machining accuracy, kinematic smoothness, and robot stiffness."
          - "Results published in Robotics and Computer-Integrated Manufacturing, 2023."

      - company: "Shanghai Jiao Tong University"
        position: "Research Assistant — Posture Optimization in Robotic Flat-End Milling"
        location: "Shanghai, China"
        start_date: "2021-10"
        end_date: "2022-10"
        highlights:
          - "Developed a sequential quadratic programming-based optimization framework for jointly optimizing tool orientation and kinematic redundancy under geometric and kinematic constraints."
          - "Results published in ASME Journal of Manufacturing Science and Engineering, 2023."

      - company: "Shanghai Jiao Tong University"
        position: "Research Assistant — Corner Smoothing of Five-Axis Toolpaths"
        location: "Shanghai, China"
        start_date: "2021-03"
        end_date: "2021-10"
        highlights:
          - "Built a unified analytical conformal-geometric-algebra framework for five-axis toolpath smoothing; published in Computer-Aided Design, 2022."

      - company: "Shanghai Jiao Tong University"
        position: "Research Assistant — Trajectory Planning for Quadrotors"
        location: "Shanghai, China"
        start_date: "2019-07"
        end_date: "2020-09"
        highlights:
          - "Generated smooth, collision-free, jerk-constrained trajectories via sequential convex programming; published in Science China Technological Sciences, 2021."

