sections:
  - number: "01"
    title_en: "Hybrid Additive-Subtractive Manufacturing"
    title_zh: "增减材复合制造过程规划"
    layout: "two"
    projects:
      - media_type: "image"
        media: "/assets/img/project_preview/HybridFieldOpt.png"
        media_class: "project-media-contain"
        alt: "Continuous field optimization pipeline for hybrid manufacturing"
        meta_en: "Under Review"
        meta_zh: "审稿中"
        title_en: "Scalable and Distortion-Aware Field Optimization for Hybrid Manufacturing"
        title_zh: "面向复合制造的可扩展且考虑变形的场优化"
        summary_en: "We present a field-based optimization framework for hybrid additive-subtractive manufacturing. Continuous neural fields determine fabrication sequences, support material, and tool configurations while optimizing shape conformance, fabrication time, and intermediate-structure distortion under manufacturing constraints. The method scales to large models, preserves fine features, reduces unnecessary support, and improves toolpath smoothness."
        summary_zh: "我们提出了一种面向增减材复合制造的基于场的优化框架。连续神经场在制造约束下确定制造序列、支撑材料与刀具配置，同时优化形状一致性、制造时间和中间结构变形。该方法可扩展至大型模型，能够保留精细特征、减少不必要的支撑，并提高刀具路径的平滑性。"
        links:
          - label_en: "Project"
            label_zh: "主页"
            url: "https://yongxue-chen.github.io/hybManuFieldOpt/"
          - label_en: "Code"
            label_zh: "代码"
            url: "https://github.com/Yongxue-Chen/hybManuFieldOpt"
      - media_type: "video"
        video_id: "QE_5t5a_qDg"
        poster: "/assets/img/publication_preview/SIGAsia2025HybridManu.jpg"
        alt: "Inverse-operation planning for hybrid additive-subtractive manufacturing"
        meta_en: "ACM Transactions on Graphics · 2025"
        meta_zh: "ACM Transactions on Graphics · 2025"
        title_en: "Can Any Model Be Fabricated?"
        title_zh: "任意模型都可以被制造吗？"
        summary_en: "A scalable inverse-operation planner that computes interleaved additive and subtractive steps while maintaining manufacturability and structural stability throughout fabrication."
        summary_zh: "通过逆向操作搜索增材与减材交替序列，在制造全过程中同时保证中间结构的可制造性与稳定性，并可扩展到大规模体素模型。"
        links:
          - label_en: "Project"
            label_zh: "主页"
            url: "https://yongxue-chen.github.io/hybManuAccEro/"
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1145/3763355"
          - label_en: "Code"
            label_zh: "代码"
            url: "https://github.com/Yongxue-Chen/hybManuAccEro"
          - label_en: "Video"
            label_zh: "视频"
            url: "https://youtu.be/QE_5t5a_qDg"
  - number: "02"
    title_en: "Robot-Assisted Machining and Trajectory Co-Optimization"
    title_zh: "机器人辅助加工与轨迹协同规划"
    layout: "three"
    projects:
      - media_type: "image"
        media: "/assets/img/publication_preview/TASEConTrajOptm.jpg"
        alt: "Concurrent trajectory optimization for robot-assisted manufacturing"
        meta_en: "IEEE Transactions on Automation Science and Engineering · 2025"
        meta_zh: "IEEE Transactions on Automation Science and Engineering · 2025"
        title_en: "Concurrent Robot Trajectory Optimization"
        title_zh: "机器人轨迹协同优化"
        summary_en: "Jointly optimizes tool orientations, kinematic redundancy, and waypoint timing through a scalable decomposition scheme for long manufacturing toolpaths."
        summary_zh: "面向长制造路径，利用可扩展的分解算法联合优化工具姿态、机器人运动学冗余自由度与路径点时间分配。"
        links:
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1109/TASE.2025.3542218"
          - label_en: "Code"
            label_zh: "代码"
            url: "https://github.com/Yongxue-Chen/ConcurrentTrajOpt"
      - media_type: "image"
        media: "/assets/img/publication_preview/RCIMFlankMilling.jpg"
        alt: "Six-degree-of-freedom path optimization for robotic flank milling"
        meta_en: "Robotics and Computer-Integrated Manufacturing · 2023"
        meta_zh: "Robotics and Computer-Integrated Manufacturing · 2023"
        title_en: "6-DoF Toolpath Optimization"
        title_zh: "六自由度刀具路径优化"
        summary_en: "Directly generates six-degree-of-freedom robotic flank-milling paths by balancing machining accuracy, motion smoothness, and robot stiffness."
        summary_zh: "直接生成机器人侧铣的六自由度刀具路径，联合考虑加工精度、运动平滑性与机器人刚度。"
        links:
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1016/j.rcim.2023.102640"
      - media_type: "image"
        media: "/assets/img/publication_preview/JMSERobotPosture.jpg"
        alt: "Posture optimization for robotic flat-end milling"
        meta_en: "ASME Journal of Manufacturing Science and Engineering · 2023"
        meta_zh: "ASME Journal of Manufacturing Science and Engineering · 2023"
        title_en: "Robot Posture Optimization"
        title_zh: "机器人加工位姿优化"
        summary_en: "Optimizes tool orientation and robot redundancy for flat-end milling while balancing machining width, smoothness, joint limits, and gouging avoidance."
        summary_zh: "联合优化平底铣削中的刀具姿态与机器人冗余自由度，兼顾加工宽度、运动平滑性、关节约束与过切避免。"
        links:
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1115/1.4056707"
  - number: "03"
    title_en: "Geometric Algebra for Machining Geometry"
    title_zh: "基于几何代数的加工几何建模"
    layout: "two"
    projects:
      - media_type: "image"
        media: "/assets/img/publication_preview/CADCornerSmoothing.jpg"
        alt: "Geometric-algebra-based corner smoothing for five-axis toolpaths"
        meta_en: "Computer-Aided Design · 2022"
        meta_zh: "Computer-Aided Design · 2022"
        title_en: "Analytical Five-Axis Corner Smoothing"
        title_zh: "五轴刀具路径转角解析光顺"
        summary_en: "Constructs analytical G³-continuous transitions for five-axis linear paths using conformal geometric algebra, with direct control of approximation error."
        summary_zh: "利用共形几何代数为五轴线性刀具路径构造解析的 G³ 连续过渡曲线，并直接控制轮廓逼近误差。"
        links:
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1016/j.cad.2022.103408"
      - media_type: "image"
        media: "/assets/img/publication_preview/CADCutterEnvelope.jpg"
        alt: "Point-pair representation of cutter swept envelopes"
        meta_en: "Computer-Aided Design · 2023"
        meta_zh: "Computer-Aided Design · 2023"
        title_en: "Cutter Swept-Envelope Modeling"
        title_zh: "刀具扫掠包络面建模"
        summary_en: "Uses conformal point-pair primitives to derive a compact analytical representation of rotary-cutter swept envelopes and support collision detection."
        summary_zh: "基于共形几何中的点对表达，建立回转刀具扫掠包络面的统一解析模型，并用于五轴加工碰撞检测。"
        links:
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1016/j.cad.2023.103588"
  - number: "04"
    title_en: "Aerial Robot Trajectory Planning"
    title_zh: "无人机轨迹规划"
    layout: "single"
    projects:
      - media_type: "image"
        media: "/assets/img/publication_preview/SCTSFlyingRobot.jpg"
        alt: "Collision-free and jerk-constrained trajectory planning for a quadrotor"
        meta_en: "Science China Technological Sciences · 2021"
        meta_zh: "Science China Technological Sciences · 2021"
        title_en: "Collision-Free, Jerk-Constrained Trajectories"
        title_zh: "无碰撞且满足跃度约束的轨迹生成"
        summary_en: "Generates C³-continuous quadrotor trajectories through sparse waypoints while enforcing chord-error, collision, velocity, acceleration, and jerk constraints."
        summary_zh: "面向稀疏路径点生成 C³ 连续的四旋翼轨迹，同时满足弦误差、无碰撞、速度、加速度与跃度约束。"
        links:
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1007/s11431-021-1836-7"
