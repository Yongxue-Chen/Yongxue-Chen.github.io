sections:
  - number: "01"
    title_en: "Hybrid Additive-Subtractive Manufacturing"
    title_zh: "增减材复合制造过程规划"
    layout: "two"
    projects:
      - media_type: "image"
        media: "/assets/img/project_preview/HybridFieldOpt.png"
        alt: "Continuous field optimization pipeline for hybrid manufacturing"
        meta_en: "Under Review"
        meta_zh: "审稿中"
        title_en: "Scalable and Distortion-Aware Field Optimization for Hybrid Manufacturing"
        title_zh: "面向复合制造的可扩展且考虑变形的场优化"
        summary_en: "The framework uses continuous neural fields to determine fabrication sequences, support material, and tool configurations while jointly optimizing shape conformance, fabrication time, and intermediate-structure distortion under manufacturing constraints. It scales to large models, preserves fine features, reduces unnecessary support, and improves toolpath smoothness."
        summary_zh: "该框架利用连续神经场，在制造约束下确定制造序列、支撑材料与刀具配置，同时联合优化形状一致性、制造时间和中间结构变形。其可扩展至大型模型，能够保留精细特征、减少不必要的支撑，并提高刀具路径的平滑性。"
        links:
          - label_en: "Project"
            label_zh: "主页"
            url: "https://yongxue-chen.github.io/hybManuFieldOpt/"
          - label_en: "Code"
            label_zh: "代码"
            url: "https://github.com/Yongxue-Chen/hybManuFieldOpt"
      - media_type: "video"
        video_id: "QE_5t5a_qDg"
        poster: "/assets/img/publication_preview/SIGAsia2025HybridManu.jpg"
        alt: "Inverse-operation planning for hybrid additive-subtractive manufacturing"
        meta_en: "ACM Transactions on Graphics · 2025"
        meta_zh: "ACM Transactions on Graphics · 2025"
        title_en: "Inverse Operation-Based Planning for Hybrid Manufacturing"
        title_zh: "面向复合制造的逆向操作规划"
        summary_en: "The planner searches for inverse operations that progressively transform a target model into a null shape. Each operation defines an AM or SM step while preserving the manufacturability and structural stability of intermediate shapes. We theoretically prove that our method can automatically fabricate any shape exactly."
        summary_zh: "该规划方法通过搜索一系列逆向操作，将目标模型逐步转化为空形。每个逆向操作对应一个增材制造（AM）或减材制造（SM）步骤，并保证中间结构的可制造性与稳定性。我们从理论上证明，该方法可以自动、精确地制造任意形状。"
        links:
          - label_en: "Project"
            label_zh: "主页"
            url: "https://yongxue-chen.github.io/hybManuAccEro/"
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1145/3763355"
          - label_en: "Code"
            label_zh: "代码"
            url: "https://github.com/Yongxue-Chen/hybManuAccEro"
          - label_en: "Video"
            label_zh: "视频"
            url: "https://youtu.be/QE_5t5a_qDg"
  - number: "02"
    title_en: "Trajectory Co-Optimization for Robot-Assisted Manufacturing"
    title_zh: "面向机器人辅助制造的轨迹协同优化"
    layout: "three"
    projects:
      - media_type: "image"
        media: "/assets/img/publication_preview/TASEConTrajOptm.jpg"
        alt: "Concurrent trajectory optimization for robot-assisted manufacturing"
        meta_en: "IEEE Transactions on Automation Science and Engineering · 2025"
        meta_zh: "IEEE Transactions on Automation Science and Engineering · 2025"
        title_en: "General and Scalable Concurrent Trajectory Planning for Robot-Assisted Manufacturing"
        title_zh: "面向机器人辅助制造的通用可扩展轨迹协同规划"
        summary_en: "The framework concurrently plans tool orientations, kinematic redundancy, and waypoint timing for long robot-assisted manufacturing toolpaths. A parallelizable, decomposition-based out-of-core scheme improves computational efficiency while enhancing kinematic smoothness under manufacturing constraints. The general formulation applies to AM and SM processes as well as single- and multi-robot systems."
        summary_zh: "该框架面向长距离机器人辅助制造路径，协同规划工具姿态、运动学冗余自由度和路径点时间。采用可并行的分解式核外优化方法提升计算效率，并在满足制造约束的同时改善运动学平滑性。该通用形式适用于 AM 与 SM 工艺，以及单机器人和多机器人系统。"
        links:
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1109/TASE.2025.3542218"
          - label_en: "Code"
            label_zh: "代码"
            url: "https://github.com/Yongxue-Chen/ConcurrentTrajOpt"
      - media_type: "image"
        media: "/assets/img/publication_preview/RCIMFlankMilling.jpg"
        alt: "Six-degree-of-freedom path optimization for robotic flank milling"
        meta_en: "Robotics and Computer-Integrated Manufacturing · 2023"
        meta_zh: "Robotics and Computer-Integrated Manufacturing · 2023"
        title_en: "6-DoF Toolpath Planning for Robotic Flank Milling"
        title_zh: "机器人侧铣的六自由度刀具路径规划"
        summary_en: "The method directly plans 6-DoF robotic flank-milling toolpaths instead of optimizing robot redundancy after conventional five-axis planning. Conformal geometric algebra evaluates machining error, while lexicographic sequential quadratic programming jointly improves toolpath smoothness and robot stiffness, yielding greater efficiency, robustness, and machining performance."
        summary_zh: "该方法直接规划机器人侧铣的六自由度刀具路径，取代在传统五轴路径基础上再优化机器人冗余自由度的两阶段方法。利用共形几何代数计算加工误差，并采用基于数组字典序的序列二次规划联合改善路径平滑性与机器人刚度，从而提升效率、鲁棒性和加工性能。"
        links:
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1016/j.rcim.2023.102640"
      - media_type: "image"
        media: "/assets/img/publication_preview/JMSERobotPosture.jpg"
        alt: "Posture optimization for robotic flat-end milling"
        meta_en: "ASME Journal of Manufacturing Science and Engineering · 2023"
        meta_zh: "ASME Journal of Manufacturing Science and Engineering · 2023"
        title_en: "Concurrent Tool-Orientation and Redundancy Planning for Robotic Flat-End Milling"
        title_zh: "机器人平底刀铣削的刀具姿态与冗余协同规划"
        summary_en: "The method concurrently plans tool orientation and robot functional redundancy for robotic flat-end milling. Sequential quadratic programming balances machining width and toolpath smoothness while enforcing joint limits and gouging avoidance, producing feasible, smooth postures for complex-surface machining."
        summary_zh: "该方法面向机器人平底刀铣削，协同规划刀具姿态与机器人功能冗余自由度。采用序列二次规划平衡加工宽度和刀具路径平滑性，同时满足关节限位与过切避免约束，为复杂曲面加工生成可行且平滑的机器人位姿。"
        links:
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1115/1.4056707"
  - number: "03"
    title_en: "Geometric Algebra for Machining Geometry"
    title_zh: "基于几何代数的加工几何建模"
    layout: "two"
    projects:
      - media_type: "image"
        media: "/assets/img/publication_preview/CADCornerSmoothing.jpg"
        alt: "Geometric-algebra-based corner smoothing for five-axis toolpaths"
        meta_en: "Computer-Aided Design · 2022"
        meta_zh: "Computer-Aided Design · 2022"
        title_en: "Analytical Five-Axis Corner Smoothing"
        title_zh: "五轴刀具路径转角解析光顺"
        summary_en: "Constructs analytical G³-continuous transitions for five-axis linear paths using conformal geometric algebra, with direct control of approximation error."
        summary_zh: "利用共形几何代数为五轴线性刀具路径构造解析的 G³ 连续过渡曲线，并直接控制轮廓逼近误差。"
        links:
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1016/j.cad.2022.103408"
      - media_type: "image"
        media: "/assets/img/publication_preview/CADCutterEnvelope.jpg"
        alt: "Point-pair representation of cutter swept envelopes"
        meta_en: "Computer-Aided Design · 2023"
        meta_zh: "Computer-Aided Design · 2023"
        title_en: "Cutter Swept-Envelope Modeling"
        title_zh: "刀具扫掠包络面建模"
        summary_en: "Uses conformal point-pair primitives to derive a compact analytical representation of rotary-cutter swept envelopes and support collision detection."
        summary_zh: "基于共形几何中的点对表达，建立回转刀具扫掠包络面的统一解析模型，并用于五轴加工碰撞检测。"
        links:
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1016/j.cad.2023.103588"
  - number: "04"
    title_en: "Aerial Robot Trajectory Planning"
    title_zh: "无人机轨迹规划"
    layout: "single"
    projects:
      - media_type: "image"
        media: "/assets/img/publication_preview/SCTSFlyingRobot.jpg"
        alt: "Collision-free and jerk-constrained trajectory planning for a quadrotor"
        meta_en: "Science China Technological Sciences · 2021"
        meta_zh: "Science China Technological Sciences · 2021"
        title_en: "Collision-Free, Jerk-Constrained Trajectories"
        title_zh: "无碰撞且满足跃度约束的轨迹生成"
        summary_en: "Generates C³-continuous quadrotor trajectories through sparse waypoints while enforcing chord-error, collision, velocity, acceleration, and jerk constraints."
        summary_zh: "面向稀疏路径点生成 C³ 连续的四旋翼轨迹，同时满足弦误差、无碰撞、速度、加速度与跃度约束。"
        links:
          - label_en: "Paper"
            label_zh: "文章"
            url: "https://doi.org/10.1007/s11431-021-1836-7"
